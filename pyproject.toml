[project]
name = "hermes-trading"
version = "0.1.0"
description = "Paper-mode self-improving futures trading worker (MNQ/MGC)"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.0",
    "yfinance>=0.2.40",
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "aiofiles>=23.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "rich>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hermes_trading"]

